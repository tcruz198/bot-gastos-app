<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="chancho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE1E6"/>
      <stop offset="1" stop-color="#F9B8C6"/>
    </linearGradient>
    <linearGradient id="moneda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <!-- brillo suave -->
  <circle cx="120" cy="90" r="190" fill="#FFFFFF" opacity="0.06"/>

  <!-- moneda entrando -->
  <circle cx="262" cy="118" r="44" fill="url(#moneda)"/>
  <circle cx="262" cy="118" r="30" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.55"/>

  <!-- sombra -->
  <ellipse cx="258" cy="420" rx="150" ry="18" fill="#022C22" opacity="0.28"/>

  <!-- patitas -->
  <rect x="160" y="340" width="44" height="70" rx="18" fill="#F4A3B5"/>
  <rect x="300" y="340" width="44" height="70" rx="18" fill="#F4A3B5"/>

  <!-- oreja de atrás -->
  <path d="M300 168 L338 118 L350 186 Z" fill="#F4A3B5"/>
  <!-- cuerpo -->
  <ellipse cx="256" cy="275" rx="160" ry="118" fill="url(#chancho)"/>
  <!-- oreja de adelante -->
  <path d="M196 170 L180 112 L240 152 Z" fill="#F9B8C6"/>
  <!-- ranura -->
  <rect x="222" y="168" width="84" height="14" rx="7" fill="#C2647A" opacity="0.75"/>
  <!-- trompa -->
  <ellipse cx="408" cy="282" rx="40" ry="34" fill="#F4A3B5"/>
  <ellipse cx="396" cy="282" rx="7" ry="10" fill="#C2647A"/>
  <ellipse cx="420" cy="282" rx="7" ry="10" fill="#C2647A"/>
  <!-- ojo -->
  <circle cx="344" cy="236" r="11" fill="#3F1D27"/>
  <circle cx="347" cy="232" r="3.5" fill="#FFFFFF"/>
  <!-- mejilla -->
  <ellipse cx="350" cy="276" rx="16" ry="10" fill="#F28CA5" opacity="0.6"/>
  <!-- colita -->
  <path d="M98 262 q-30 -8 -22 -32 q8 -18 26 -4" fill="none" stroke="#F4A3B5" stroke-width="10" stroke-linecap="round"/>
</svg>
